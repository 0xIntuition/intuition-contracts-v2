name: npm artifacts
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          # .nvmrc holds the Node major for CI and nvm users alike; check-latest
          # resolves its newest patch from the Node manifest instead of whatever
          # the runner's toolcache happens to hold.
          node-version-file: ".nvmrc"
          check-latest: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.6
      - run: bun install --frozen-lockfile
      - run: bun run release:check
