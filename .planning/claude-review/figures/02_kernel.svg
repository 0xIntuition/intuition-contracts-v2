<rect width='640' height='640' fill='#ffffff'/>
<text x='90' y='26' font-size='16' font-weight='600' fill='#111827'>Fulcrum kernel: raw weight each recipient tier gets from a fee sourced at tier s</text>
<text x='90' y='44' font-size='12' fill='#6b7280'>alpha = BPS, sigma = 4 → weights 0.75 / 0.5 / 0.25 for d = 1,2,3. Normalised over ELIGIBLE tiers only; within a tier pro-rata by stake.</text>
